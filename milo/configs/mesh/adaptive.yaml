# Adaptive variant of default.yaml: starts from a smaller importance-sampled pivot
# set and grows it over the course of mesh regularization (instead of sampling a
# fixed set once and freezing it), and replaces the plain occupied-centers erosion
# loss with a residual-weighted fix. Combine with --adaptive_gaussians on the CLI to
# also enable adaptive Gaussian densification during the mesh phase.
#
# All non-adaptive keys are identical to default.yaml; see that file for their meaning.

# Regularization schedule
start_iter: 8_001
mesh_update_interval: 1
stop_iter: 18000

# Depth loss weight
use_depth_loss: true
depth_weight: 0.05
depth_ratio: 1.0
mesh_depth_loss_type: "log"

# Normal loss weight
use_normal_loss: true
normal_weight: 0.05
use_depth_normal: true

# Delaunay computation
delaunay_reset_interval: 500
n_max_points_in_delaunay: 5_400_000  # Used as fallback if adaptive_pivots is false
delaunay_sampling_method: "surface"
filter_large_edges: true
collapse_large_edges: false

# --- Adaptive pivot growth ---
# Start from a third of the final budget and grow it every delaunay_reset_interval
# iterations (growth is only picked up when the Delaunay set is actually resampled,
# so keeping this aligned with delaunay_reset_interval avoids extra resampling passes).
adaptive_pivots: true
pivot_budget_init: 1_800_000
pivot_budget_max: 5_400_000
pivot_growth_interval: 500
pivot_growth_factor: 1.35
# Stop growing/resampling pivots for the last 3000 iterations, to fine-tune SDFs on a
# stable pivot set (mirrors the baseline's own fixed-set behavior for its whole mesh phase).
pivot_freeze_last_iters: 3000

# Rasterization
# Adaptive Gaussian densification can grow the final mesh well past nvdiffrast's
# ~16.7M-triangle single-pass limit (scene/mesh.py's ScalableMeshRenderer batches
# rasterization to stay under it); default.yaml doesn't need this since its mesh
# stays smaller without unbounded Gaussian growth.
use_scalable_renderer: true

# SDF computation
sdf_reset_interval: 500
sdf_default_isosurface: 0.5
transform_sdf_to_linear_space: false
min_occupancy_value: 0.0000000001

#   > For Integrate
use_ema: true
alpha_ema: 0.4

#   > For TSDF
trunc_margin: 0.002

#   > For learnable
occupancy_mode: "occupancy_shift"
#       > Gaussian centers regularization
enforce_occupied_centers: true
occupied_centers_weight: 0.005
#       > Occupancy labels loss
use_occupancy_labels_loss: true
reset_occupancy_labels_every: 200
occupancy_labels_loss_weight: 0.005
#       > SDF reset
fix_set_of_learnable_sdfs: true  # Ignored: adaptive_pivots overrides the freeze logic
learnable_sdf_reset_mode: "ema"
learnable_sdf_reset_stop_iter: 15001
learnable_sdf_reset_alpha_ema: 0.4

method_to_reset_sdf: "depth_fusion"
n_binary_steps_to_reset_sdf: 0
sdf_reset_linearization_n_steps: 20
sdf_reset_linearization_enforce_std: 0.5
depth_fusion_reset_tolerance: 0.1

# --- Erosion fix ---
# Replaces the plain occupied-centers hinge (Gaussian centers only, uniform weight)
# with a residual-weighted hinge over all 9 pivots, hard-reseeds SDFs for pivots that
# look eroded in high-residual regions instead of smoothly EMA-blending them, and
# softly penalizes occupancy-shift magnitudes that would push occupancy into the
# saturated (zero-gradient) regime.
use_adaptive_erosion_fix: true
erosion_occupancy_threshold: 0.9
erosion_residual_threshold: 1.5
erosion_residual_weight_clip: 5.0
erosion_hard_reseed_alpha: 1.0
use_erosion_anti_saturation: true
erosion_anti_saturation_weight: 0.001
erosion_anti_saturation_margin: 4.0

# Foreground Culling
radius_culling: -1.0
