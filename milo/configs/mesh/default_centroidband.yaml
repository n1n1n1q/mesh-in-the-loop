# Mesh-in-the-loop with the DMesh++ face-centroid-band meshing REPLACING marching-tetrahedra.
#
# Instead of extracting the isosurface of a learnable SDF (marching-tets), the in-loop mesh is the
# Delaunay-of-pivots whose faces are kept by the face-centroid TSDF band (the post-hoc winner:
# Truck F1 0.6895 vs the 0.6372 density-SDF marching-tets bar). Mesh verts ARE the pivots, so the
# same depth/normal render loss flows straight to the Gaussian geometry. There is NO learnable SDF
# in this path, so the SDF/occupancy resets and occupancy-based losses are disabled below.
#
# Toggle: `use_centroid_band_mesh: true`. Every other file stays on marching-tets (byte-identical).

# Regularization schedule
start_iter: 8_001
mesh_update_interval: 1
stop_iter: 18000

# Depth loss weight
use_depth_loss: true
depth_weight: 0.05  # 0.05
depth_ratio: 1.0  # 0.6
mesh_depth_loss_type: "log"  # "log"

# Normal loss weight
use_normal_loss: true  # true
normal_weight: 0.05  # 0.05
use_depth_normal: true  # true

# Delaunay computation
delaunay_reset_interval: 500  # 500
n_max_points_in_delaunay: 5_400_000  # -1 for no limit
delaunay_sampling_method: "surface"  # "random", "surface" or "surface+opacity"
filter_large_edges: false   # cband has no tet end-points -> must be off
collapse_large_edges: false

# Rasterization
use_scalable_renderer: false

# SDF computation
sdf_reset_interval: 500  # 500  (re-fuses the per-pivot TSDF that drives the band)
sdf_default_isosurface: 0.5  # 0.5
transform_sdf_to_linear_space: false  # SHOULD BE FALSE
min_occupancy_value: 0.0000000001  # 0.0000000001

#   > For Integrate
use_ema: true  # true
alpha_ema: 0.4  # 0.4

#   > For TSDF
trunc_margin: 0.002  # 0.002

#   > For learnable  (UNUSED in cband, kept for schema compatibility)
occupancy_mode: "occupancy_shift"
#       > Gaussian centers regularization
enforce_occupied_centers: false   # no learnable SDF -> off
occupied_centers_weight: 0.005
#       > Occupancy labels loss
use_occupancy_labels_loss: false  # no learnable SDF -> off
reset_occupancy_labels_every: 200
occupancy_labels_loss_weight: 0.005
#       > SDF reset
fix_set_of_learnable_sdfs: true
learnable_sdf_reset_mode: "none"
learnable_sdf_reset_stop_iter: 13001
learnable_sdf_reset_alpha_ema: 0.4

method_to_reset_sdf: "depth_fusion"  # cband uses the depth-fusion TSDF directly
n_binary_steps_to_reset_sdf: 0
sdf_reset_linearization_n_steps: 20
sdf_reset_linearization_enforce_std: 0.5
depth_fusion_reset_tolerance: 0.1

# Foreground Culling
radius_culling: -1.0  # -1.0 for no culling

# Weighted triangulation (off -> plain CGAL Delaunay)
use_weighted_triangulation: false
wdt_weight_mode: "none"
wdt_weight_scale: 0.0

# ---- DMesh++ face-centroid-band meshing (this file's purpose) ----
use_centroid_band_mesh: true
centroid_pool_band: 1.2   # keep faces with all 3 verts |tsdf| < pool_band
centroid_band_cut: 0.4    # keep faces with |mean signed tsdf of 3 verts| < cut
