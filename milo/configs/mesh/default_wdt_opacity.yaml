# Regularization schedule
start_iter: 8_001
mesh_update_interval: 1 
stop_iter: 18000

# Depth loss weight
use_depth_loss: true
depth_weight: 0.05  # 0.05
depth_ratio: 1.0  # 0.6 
mesh_depth_loss_type: "log"  # "log"

# Normal loss weight
use_normal_loss: true  # true
normal_weight: 0.05  # 0.05
use_depth_normal: true  # true

# Delaunay computation
delaunay_reset_interval: 500  # 500
n_max_points_in_delaunay: 5_400_000  # -1 for no limit
delaunay_sampling_method: "surface"  # "random", "surface" or "surface+opacity"
filter_large_edges: true  # true or false?
collapse_large_edges: false  # true or false?

# Rasterization
use_scalable_renderer: false

# SDF computation
sdf_reset_interval: 500  # 500
sdf_default_isosurface: 0.5  # 0.5
transform_sdf_to_linear_space: false  # SHOULD BE FALSE
min_occupancy_value: 0.0000000001  # 0.0000000001

#   > For Integrate
use_ema: true  # true
alpha_ema: 0.4  # 0.4

#   > For TSDF
trunc_margin: 0.002  # 0.002

#   > For learnable
occupancy_mode: "occupancy_shift"  # "occupancy_shift" or "density_shift"
#       > Gaussian centers regularization
enforce_occupied_centers: true  # true
occupied_centers_weight: 0.005  # 0.005
#       > Occupancy labels loss
use_occupancy_labels_loss: true  # true or false?
reset_occupancy_labels_every: 200  # 200
occupancy_labels_loss_weight: 0.005  # 0.005
#       > SDF reset
fix_set_of_learnable_sdfs: true  # false or true?
learnable_sdf_reset_mode: "ema"  # "none" or "ema"
learnable_sdf_reset_stop_iter: 13001
learnable_sdf_reset_alpha_ema: 0.4  # 0.4

method_to_reset_sdf: "depth_fusion"  # "integration" or "depth_fusion"
n_binary_steps_to_reset_sdf: 0  # Use 0 to disable binary search
sdf_reset_linearization_n_steps: 20
sdf_reset_linearization_enforce_std: 0.5  # 0.5
depth_fusion_reset_tolerance: 0.1

# Foreground Culling
radius_culling: -1.0  # -1.0 for no culling

# ---- Experiment: weighted (regular) triangulation (branch `dmesh`) ----
# Default OFF -> `default` is byte-identical to upstream MILo (plain CGAL Delaunay).
# When on, MILo's Delaunay is replaced by a CGAL regular (weighted / Laguerre) triangulation
# (dmesh2 mindiffdt._C.compute_wdt). Non-differentiable: static per-pivot weights, no gradients.
# With wdt_weight_mode == "none" the regular triangulation reproduces the Delaunay tet set.
# THE OPACITY ARM (kill-criterion follow-up to default_wdt_static's F1 0.5104 loss).
# w_i = (scale * s_i)^2 * opacity_i -- still locally scaled, but survival is tied to *photometric*
# importance instead of pure geometry. Hypothesis: scale_sq lost recall because geometry-blind
# burying removed load-bearing sites; weighting by opacity should bury the sites that don't matter.
# wdt_weight_scale is auto-set by scripts/wdt_hidden_sweep.py --mode opacity --target-hidden 11.6
# so this arm buries the SAME fraction as the static arm -- isolating *which* sites get buried.
use_weighted_triangulation: true
wdt_weight_mode: "opacity"   # "none" | "scale_sq" | "aniso" | "opacity"
wdt_weight_scale: 0.08       # chosen by opacity sweep to match ~11.6% hidden